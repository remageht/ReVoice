[package]
name = "revoice"
version = "0.1.0"
description = "ReVoice — студия клонирования голоса"
authors = ["ReVoice Contributors"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "revoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "revoice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.5", features = [
    "tray-icon",
    "image-png",
] }
tauri-plugin-shell = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-autostart = "2.2"
tauri-plugin-updater = "2.7"
tauri-plugin-process = "2.2"
tauri-plugin-clipboard-manager = "2.2"
tauri-plugin-http = "2.4"
tauri-plugin-log = "2.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
