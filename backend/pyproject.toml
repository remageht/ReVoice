[project]
name = "revoice-server"
version = "0.1.2"
description = "ReVoice voice cloning backend"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "sqlalchemy==2.0.41",
    "pydantic==2.11.7",
    "pydantic-settings==2.9.1",
    "aiosqlite==0.21.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "librosa==0.10.2.post1",
    "soundfile==0.13.1",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "faster-whisper==1.1.1",
    "huggingface-hub>=0.34.0,<1.0",
    "pedalboard==0.9.17",
    "psutil==7.0.0",
    "sse-starlette==2.2.1",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
cuda = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.57.3",
    "qwen-tts==0.1.1",
    "accelerate==1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revoice"]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]
